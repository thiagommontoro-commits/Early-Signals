# Nome do fluxo de trabalho que aparecerá na aba "Actions" do GitHub
name: Gerar Dashboard Early Signals

on:
  # Roda automaticamente quando houver uma alteração na branch 'main' ou 'master'
  push:
    branches:
      - main
      - master
    # Não roda de novo quando só o cache/dados/index mudaram (economiza cota do Gemini)
    paths-ignore:
      - 'index.html'
      - 'dados_paises.json'
      - 'cache_*.json'
      - 'debug_ia/**'
  # Permite rodar manualmente pela interface do GitHub
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Ignorar cache e regerar todos os países (gasta mais cota)'
        type: boolean
        default: false
  # Toda primeira sexta-feira de cada mês às 08:00 UTC (05:00 Brasília)
  schedule:
    - cron: '0 8 1-7 * 5'

permissions:
  # Permissão necessária para salvar os arquivos gerados no repositório
  contents: write

# Evita duas execuções ao mesmo tempo (dobraria o gasto de cota)
concurrency:
  group: early-signals
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 1. Baixar o código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar as bibliotecas Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Baixa o Chromium usado pelo agrobr (conab.safras -> produtividade)
      - name: 3b. Instalar navegador do Playwright (para dados de safra da CONAB)
        run: python -m playwright install --with-deps chromium

      - name: 4. Gerar o arquivo index.html
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GEMINI_MODEL_RESERVA: gemini-3.5-flash-lite   # usado quando o principal esgota a cota ou sai do ar
          FORCAR_IA: ${{ github.event.inputs.forcar == 'true' && '1' || '0' }}
          PYTHONUNBUFFERED: "1"                          # log aparece em tempo real
          # Fonte do preço para a receita (CEPEA é a única exposta pelo agrobr)
          EARLY_SIGNALS_PRECO_FONTE: cepea
        run: python gerador_dashboard_early_signals.py

      # Salva MESMO se o passo 4 falhar, para não perder o cache já gerado.
      # Sem conflito: guarda os arquivos gerados, pega a versão mais nova do repositório
      # (preservando qualquer alteração feita por você durante a execução) e grava por cima
      # apenas os arquivos gerados. Tenta até 3 vezes.
      - name: 5. Salvar index.html, dados e cache no repositório
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/gerados
          for f in index.html dados_paises.json cache_*.json; do
            [ -e "$f" ] && cp "$f" /tmp/gerados/
          done
          for tentativa in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/gerados/* . 2>/dev/null || true
            for f in /tmp/gerados/*; do git add -f "$(basename "$f")"; done
            if git diff --staged --quiet; then
              echo "Nada para salvar."
              exit 0
            fi
            git commit -m "📊 Atualização automática do dashboard Early Signals [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "✅ Arquivos salvos no repositório."
              exit 0
            fi
            echo "Push recusado (repositório mudou). Tentando de novo ($tentativa/3)..."
            sleep 5
          done
          echo "❌ Não foi possível salvar após 3 tentativas."
          exit 1
